<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏗️ Éco-Chantier Challenge</title>
    <style>
        /* ===================================================
           CHARTE GRAPHIQUE DIGITALE EIFFAGE v2.0
           =================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap');

        :root {
            /* --- Couleurs principales Eiffage --- */
            --eif-red:          #FF0000;
            --eif-black:        #000000;
            --eif-gray-dark:    #777777;
            --eif-gray-light:   #C4C4C4;
            --eif-white:        #FFFFFF;

            /* --- Couleurs complémentaires --- */
            --eif-blue:         #0088CE;
            --eif-green:        #34B233;
            --eif-yellow:       #FED100;
            --eif-gray-comp:    #6D6F72;

            /* --- Couleurs fonctionnelles --- */
            --success:          #34B233;
            --success-light:    #e6f4e6;
            --error:            #FF0000;
            --error-light:      #ffe6e6;

            /* --- Fond & ombres --- */
            --bg:               #F5F5F5;
            --shadow:           0 4px 8px rgba(0,0,0,0.06);

            /* --- Typographies (fallbacks pour Acumin/Kepler) --- */
            --font-sans:        'Source Sans 3', 'Acumin Pro', 'Segoe UI', Helvetica, Arial, sans-serif;
            --font-serif:       'Source Serif 4', 'Kepler Std', Georgia, 'Times New Roman', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--eif-black);
            font-size: 16px;
            line-height: 1.5;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===================================================
           ANIMATIONS
           =================================================== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-6px); }
            40%, 60% { transform: translateX(6px); }
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.3); }
            70%  { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        /* ===================================================
           LAYOUT – Grille 8pt
           =================================================== */
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.5s ease-out;
        }

        /* ===================================================
           HEADER
           =================================================== */
        .game-header {
            text-align: center;
            padding: 24px 16px;
            background: var(--eif-white);
            box-shadow: var(--shadow);
            border-top: 4px solid var(--eif-red);
        }
        .game-header h1 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--eif-black);
            margin-bottom: 8px;
            letter-spacing: 0;
        }
        .game-header .subtitle {
            font-family: var(--font-sans);
            font-size: 16px;
            font-weight: 400;
            color: var(--eif-gray-dark);
            margin-bottom: 16px;
        }

        /* --- Stats badges --- */
        .stats {
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .stat-badge {
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--eif-white);
            background: var(--eif-black);
            padding: 8px 24px;
            border-radius: 0;
            letter-spacing: 0.02em;
        }

        /* ===================================================
           INSTRUCTION BAR
           =================================================== */
        .instruction {
            text-align: center;
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--eif-red);
            padding: 12px 16px;
            background: var(--eif-white);
            border-left: 4px solid var(--eif-red);
        }

        /* ===================================================
           GAME AREA / SECTIONS
           =================================================== */
        .game-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .section {
            background: var(--eif-white);
            padding: 24px;
            box-shadow: var(--shadow);
        }
        .section h2 {
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--eif-red);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--eif-black);
        }

        .items-list,
        .targets-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ===================================================
           DOCUMENT CARDS (draggable)
           =================================================== */
        .doc-card {
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 1rem;
            color: var(--eif-black);
            text-align: center;
            padding: 16px;
            background: var(--eif-white);
            border: 2px solid var(--eif-gray-light);
            border-left: 5px solid var(--eif-black);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            touch-action: manipulation;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .doc-card:hover {
            border-left-color: var(--eif-red);
            color: var(--eif-red);
        }
        .doc-card:active {
            transform: scale(0.97);
        }
        .doc-card.selected {
            background: var(--eif-black);
            color: var(--eif-white);
            border-color: var(--eif-black);
            border-left-color: var(--eif-red);
            animation: pulse 1.2s infinite;
        }
        .doc-card.matched {
            opacity: 0.35;
            pointer-events: none;
            cursor: default;
            background: #f0f0f0;
            border-color: var(--eif-gray-light);
            border-left-color: var(--eif-gray-light);
            color: var(--eif-gray-dark);
            animation: none;
            text-decoration: line-through;
        }
        .doc-card.dragging {
            opacity: 0.4;
        }

        /* ===================================================
           DESCRIPTION TARGETS
           =================================================== */
        .desc-target {
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 400;
            color: var(--eif-gray-dark);
            line-height: 1.5;
            padding: 16px;
            background: #fafafa;
            border: 2px dashed var(--eif-gray-light);
            transition: all 0.2s ease;
            min-height: 64px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }
        .desc-target:hover {
            border-color: var(--eif-gray-dark);
        }
        .desc-target.drag-over {
            border-color: var(--eif-red);
            background: #fff5f5;
        }

        /* --- Correct --- */
        .desc-target.correct {
            background: var(--success-light);
            border: 2px solid var(--success);
            border-style: solid;
            pointer-events: none;
            cursor: default;
        }
        .desc-target.correct .match-title {
            display: block;
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 1rem;
            color: var(--success);
            margin-bottom: 8px;
        }
        .desc-target.correct .match-desc {
            font-size: 14px;
            color: #1a5c1a;
        }

        /* --- Incorrect --- */
        .desc-target.incorrect {
            animation: shake 0.5s ease-in-out;
            border-color: var(--eif-red);
            background: var(--error-light);
        }
        .match-title {
            display: none;
        }

        /* ===================================================
           FOOTER
           =================================================== */
        .game-footer {
            text-align: center;
            padding: 8px 0 24px;
        }
        .btn-reset {
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 18px;
            line-height: 24px;
            color: var(--eif-white);
            background: var(--eif-black);
            border: none;
            padding: 16px 32px;
            cursor: pointer;
            min-height: 48px;
            width: 100%;
            max-width: 320px;
            transition: background 0.2s ease;
            letter-spacing: 0.02em;
        }
        .btn-reset:hover {
            background: var(--eif-red);
        }

        /* ===================================================
           MODAL (victoire)
           =================================================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: var(--eif-white);
            padding: 40px 32px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            transform: scale(0.9);
            transition: transform 0.3s;
            border-top: 4px solid var(--eif-red);
        }
        .modal-overlay.show .modal-box {
            transform: scale(1);
        }
        .modal-box .emoji {
            font-size: 3rem;
            margin-bottom: 8px;
        }
        .modal-box h2 {
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--eif-black);
            margin-bottom: 8px;
            border: none;
            text-transform: none;
            letter-spacing: 0;
        }
        .modal-box p {
            font-family: var(--font-sans);
            color: var(--eif-gray-dark);
            margin-bottom: 24px;
            font-size: 1rem;
        }
        .btn-replay {
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 18px;
            color: var(--eif-white);
            background: var(--eif-black);
            border: none;
            padding: 16px 40px;
            cursor: pointer;
            min-height: 48px;
            transition: background 0.2s ease;
        }
        .btn-replay:hover {
            background: var(--eif-red);
        }

        /* ===================================================
           RESPONSIVE – Desktop (>= 1000px → 12 colonnes)
           =================================================== */
        @media (min-width: 1000px) {
            body { padding: 32px; }

            .game-header h1 {
                font-family: var(--font-serif);
                font-size: 36px;
                line-height: 43px;
            }
            .game-header .subtitle {
                font-size: 16px;
                line-height: 24px;
            }
            .game-area {
                flex-direction: row;
                gap: 32px;
                align-items: flex-start;
            }
            .section { flex: 1; }
            .section h2 { font-size: 18px; }
            .instruction { display: none; }
            .doc-card { padding: 16px 24px; }
            .desc-target { padding: 16px 24px; }
        }

        /* ===================================================
           Lignes de fond décoratives (rappel grille Eiffage)
           =================================================== */
        .game-area .section {
            position: relative;
        }
        .game-area .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            background: var(--eif-gray-light);
            opacity: 0.3;
            pointer-events: none;
        }
    </style>
</head>
<body>

<main class="game-container">
    <header class="game-header">
        <h1>🏗️ Éco-Chantier Challenge</h1>
        <p class="subtitle">Associez chaque document à sa description</p>
        <div class="stats">
            <span class="stat-badge">🎯 <span id="score">0</span> / 6</span>
            <span class="stat-badge">⏱️ <span id="timer">00:00</span></span>
        </div>
    </header>

    <div class="instruction" id="instruction">👆 Tapez un document, puis tapez sa description</div>

    <div class="game-area">
        <section class="section">
            <h2>📄 Documents</h2>
            <div class="items-list" id="itemsList"></div>
        </section>
        <section class="section">
            <h2>📋 Descriptions</h2>
            <div class="targets-list" id="targetsList"></div>
        </section>
    </div>

    <footer class="game-footer">
        <button class="btn-reset" id="resetBtn">🔄 Recommencer</button>
    </footer>
</main>

<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div class="emoji">🏆</div>
        <h2>Bravo !</h2>
        <p>Tous les documents associés en <strong id="finalTime"></strong> !</p>
        <button class="btn-replay" id="replayBtn">🔄 Rejouer</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const DATA = [
        { id: '1', doc: 'Mémoire Environnement', desc: "Document de réponse à appel d'offres présentant la politique environnementale, les mesures pour limiter les impacts du chantier et les certifications (ISO 14001, HQE…)." },
        { id: '2', doc: 'SOGED', desc: "Schéma d'Organisation et de Gestion des Déchets : tri, collecte, transport, traçabilité (BSD) et filières de valorisation/élimination des déchets." },
        { id: '3', doc: 'PAQ (Plan de contrôle)', desc: "Plan d'Assurance Qualité : procédures de contrôle interne, points d'arrêt, essais, gestion des non-conformités pour garantir la conformité au CCTP." },
        { id: '4', doc: 'SEVE', desc: "Éco-comparateur en ligne pour les TP permettant de comparer l'impact environnemental (CO₂, énergie) de variantes techniques d'un projet routier ou VRD." },
        { id: '5', doc: 'PRE', desc: "Plan de Respect de l'Environnement : identification des risques environnementaux du chantier (eau, sol, bruit, faune/flore) et mesures de prévention et procédures d'urgence." },
        { id: '6', doc: 'Registre des Terres Excavées', desc: "Registre chronologique obligatoire (loi AGEC 2020) traçant chaque lot de terres : origine, code déchet, quantité, destination. Déclaration au RNDTS si ≥ 500 m³." },
    ];

    const itemsList = document.getElementById('itemsList');
    const targetsList = document.getElementById('targetsList');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const instruction = document.getElementById('instruction');
    const modal = document.getElementById('modal');
    const finalTimeEl = document.getElementById('finalTime');

    let selected = null, score = 0, seconds = 0, interval = null;

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function startTimer() {
        clearInterval(interval);
        seconds = 0;
        interval = setInterval(() => {
            seconds++;
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            timerEl.textContent = m + ':' + s;
        }, 1000);
    }

    function init() {
        score = 0; selected = null;
        scoreEl.textContent = '0';
        timerEl.textContent = '00:00';
        modal.classList.remove('show');
        instruction.textContent = '👆 Tapez un document, puis tapez sa description';
        itemsList.innerHTML = '';
        targetsList.innerHTML = '';

        const shuffledDocs = shuffle(DATA);
        const shuffledDescs = shuffle(DATA);

        shuffledDocs.forEach(d => {
            const el = document.createElement('div');
            el.className = 'doc-card';
            el.draggable = true;
            el.dataset.id = d.id;
            el.textContent = d.doc;

            el.addEventListener('click', () => {
                if (el.classList.contains('matched')) return;
                if (selected) selected.classList.remove('selected');
                selected = el;
                el.classList.add('selected');
                instruction.textContent = '👇 Maintenant tapez la description correspondante';
            });

            el.addEventListener('dragstart', e => {
                if (el.classList.contains('matched')) { e.preventDefault(); return; }
                e.dataTransfer.setData('text/plain', el.dataset.id);
                setTimeout(() => el.classList.add('dragging'), 0);
                if (selected) selected.classList.remove('selected');
                selected = el;
                el.classList.add('selected');
            });
            el.addEventListener('dragend', () => el.classList.remove('dragging'));

            itemsList.appendChild(el);
        });

        shuffledDescs.forEach(d => {
            const el = document.createElement('div');
            el.className = 'desc-target';
            el.dataset.id = d.id;
            el.innerHTML = '<span class="match-title"></span><span class="match-desc">' + d.desc + '</span>';

            el.addEventListener('click', () => {
                if (!selected || el.classList.contains('correct')) return;
                checkMatch(selected, el);
            });

            el.addEventListener('dragover', e => {
                e.preventDefault();
                if (!el.classList.contains('correct')) el.classList.add('drag-over');
            });
            el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
            el.addEventListener('drop', e => {
                e.preventDefault();
                el.classList.remove('drag-over');
                if (el.classList.contains('correct')) return;
                const id = e.dataTransfer.getData('text/plain');
                const card = document.querySelector('.doc-card[data-id="' + id + '"]');
                if (card) checkMatch(card, el);
            });

            targetsList.appendChild(el);
        });

        startTimer();
    }

    function checkMatch(card, target) {
        if (card.dataset.id === target.dataset.id) {
            score++;
            scoreEl.textContent = score;
            card.classList.remove('selected');
            card.classList.add('matched');
            target.classList.add('correct');
            const docName = DATA.find(d => d.id === card.dataset.id).doc;
            target.querySelector('.match-title').textContent = '✅ ' + docName;
            selected = null;
            instruction.textContent = score < 6 ? '👆 Tapez un document, puis tapez sa description' : '🎉 Terminé !';

            if (score === DATA.length) {
                clearInterval(interval);
                finalTimeEl.textContent = timerEl.textContent;
                setTimeout(() => modal.classList.add('show'), 600);
            }
        } else {
            target.classList.add('incorrect');
            card.classList.remove('selected');
            selected = null;
            instruction.textContent = '❌ Mauvaise association ! Réessayez.';
            setTimeout(() => {
                target.classList.remove('incorrect');
                instruction.textContent = '👆 Tapez un document, puis tapez sa description';
            }, 700);
        }
    }

    document.getElementById('resetBtn').addEventListener('click', init);
    document.getElementById('replayBtn').addEventListener('click', init);
    init();
});
</script>
</body>
</html>
